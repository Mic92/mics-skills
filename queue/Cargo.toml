[package]
name = "queue"
version = "0.1.0"
edition = "2021"
description = "Agent-friendly frontend for pueue"
license = "MIT"

[dependencies]
pueue-lib = { version = "0.31", default-features = false, features = [
  "network_blocking",
  "settings",
] }
# chrono and serde_json are already mandatory pueue-lib dependencies;
# used for task timestamps and --json output respectively
chrono = "0.4"
serde_json = "1"
# dependency-free argument parser
lexopt = "0.3"

[profile.release]
strip = true
